name: Bug report
description: Something Karya did that it should not have done
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the command, the repository shape, and the verification report. Remove API keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
